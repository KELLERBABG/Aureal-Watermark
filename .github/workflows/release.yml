name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to rebuild (e.g. v0.2.4). Leave empty for a dry run.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build Windows artifacts
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      zip_name: ${{ steps.ver.outputs.zip_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve version from package.json
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          "zip_name=aureal-watermark-v$v-universal.zip" >> $env:GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Setup ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Run test suite
        run: node --test

      - name: Build release artifacts
        shell: pwsh
        env:
          ZIP_NAME: ${{ steps.ver.outputs.zip_name }}
        run: |
          node scripts/bundle.js
          Copy-Item dist/cli.cjs dist/aureal-watermark.cjs -Force
          Set-Content dist/sea-config.json '{"main":"dist/cli.cjs","output":"dist/sea-prep.blob","disableExperimentalSEAWarning":true}'
          node --experimental-sea-config dist/sea-config.json
          Copy-Item (Get-Command node).Source dist/aureal-watermark.exe -Force
          node scripts/stamp-icon.cjs
          npx --yes postject dist/aureal-watermark.exe NODE_SEA_BLOB dist/sea-prep.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          & .\dist\aureal-watermark.exe --help

          $tempZipDir = Join-Path $env:TEMP "aureal-universal"
          if (Test-Path $tempZipDir) { Remove-Item $tempZipDir -Recurse -Force }
          New-Item -ItemType Directory -Path $tempZipDir | Out-Null
          Copy-Item dist/aureal-watermark.cjs (Join-Path $tempZipDir "aureal-watermark.cjs")
          Copy-Item demo (Join-Path $tempZipDir "demo") -Recurse
          Copy-Item assets (Join-Path $tempZipDir "assets") -Recurse
          Copy-Item index.html, README.md, LICENSE.md $tempZipDir
          Compress-Archive -Path "$tempZipDir\*" -DestinationPath "dist/$env:ZIP_NAME" -Force
          Remove-Item $tempZipDir -Recurse -Force

      - name: Smoke-test packaged CLI
        shell: pwsh
        run: |
          node dist/aureal-watermark.cjs gen dist/smoke.wav --seconds 5
          node dist/aureal-watermark.cjs embed dist/smoke.wav dist/smoke-marked.wav --id 424242 --key ci-smoke
          node dist/aureal-watermark.cjs detect dist/smoke-marked.wav --id 424242 --key ci-smoke

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ steps.ver.outputs.version }}
          path: |
            dist/aureal-watermark.exe
            dist/aureal-watermark.cjs
            dist/${{ steps.ver.outputs.zip_name }}
          if-no-files-found: error

  publish:
    name: Publish to GitHub Release
    needs: build
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts-${{ needs.build.outputs.version }}

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Aureal Watermark ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            aureal-watermark.exe
            aureal-watermark.cjs
            *.zip
          overwrite_files: true
          fail_on_unmatched_files: true
