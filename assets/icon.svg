<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="aurBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160c2b" />
      <stop offset="45%" stop-color="#0b0617" />
      <stop offset="100%" stop-color="#040208" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="aurBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>

    <!-- Sonic Wave Gradient -->
    <linearGradient id="sonicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Core Pulse Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f3e8ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Precision Glow Filter -->
    <filter id="crispGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#aurBg)" />
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="url(#aurBorder)" stroke-width="3" />

  <!-- Radar Spread-Spectrum Targeting Rings -->
  <g opacity="0.3" stroke="#a855f7" stroke-width="1.8" fill="none" stroke-dasharray="5 7">
    <circle cx="256" cy="256" r="212" />
    <circle cx="256" cy="256" r="168" />
    <circle cx="256" cy="256" r="124" />
  </g>

  <!-- Ambient Radar Fill -->
  <circle cx="256" cy="256" r="124" fill="rgba(139, 92, 246, 0.04)" />

  <!-- Sonic Waveform Arcs (Acoustic Propagation) -->
  <g stroke="url(#sonicGrad)" fill="none" stroke-linecap="round" filter="url(#crispGlow)">
    <!-- Left Arcs -->
    <path d="M 108 152 A 180 180 0 0 0 108 360" stroke-width="5.5" opacity="0.45" />
    <path d="M 148 182 A 130 130 0 0 0 148 330" stroke-width="7.5" opacity="0.75" />
    <path d="M 188 214 A 80 80 0 0 0 188 298" stroke-width="9.5" opacity="0.95" />

    <!-- Right Arcs -->
    <path d="M 324 214 A 80 80 0 0 1 324 298" stroke-width="9.5" opacity="0.95" />
    <path d="M 364 182 A 130 130 0 0 1 364 330" stroke-width="7.5" opacity="0.75" />
    <path d="M 404 152 A 180 180 0 0 1 404 360" stroke-width="5.5" opacity="0.45" />
  </g>

  <!-- Spectral Equalizer Core Bars -->
  <g fill="url(#coreGrad)" filter="url(#crispGlow)">
    <!-- Central Max Amplitude Bar -->
    <rect x="249" y="104" width="14" height="304" rx="7" />

    <!-- Harmonic Side Bars -->
    <rect x="227" y="142" width="12" height="228" rx="6" opacity="0.92" />
    <rect x="273" y="142" width="12" height="228" rx="6" opacity="0.92" />

    <rect x="207" y="184" width="10" height="144" rx="5" opacity="0.75" />
    <rect x="295" y="184" width="10" height="144" rx="5" opacity="0.75" />

    <rect x="189" y="218" width="8" height="76" rx="4" opacity="0.55" />
    <rect x="315" y="218" width="8" height="76" rx="4" opacity="0.55" />
  </g>

  <!-- Center Forensic Target Point -->
  <circle cx="256" cy="256" r="16" fill="#ffffff" filter="url(#crispGlow)" />
  <circle cx="256" cy="256" r="8" fill="#0b0617" />
  <circle cx="256" cy="256" r="3.5" fill="#38bdf8" />

  <!-- Alignment Reticle Marks -->
  <g stroke="rgba(255, 255, 255, 0.45)" stroke-width="2" stroke-linecap="round">
    <line x1="256" y1="44" x2="256" y2="70" />
    <line x1="256" y1="442" x2="256" y2="468" />
    <line x1="44" y1="256" x2="70" y2="256" />
    <line x1="442" y1="256" x2="468" y2="256" />
  </g>
</svg>