<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0f15"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="sonicWaveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="corePulse" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>

  <!-- High-Frequency Resonance Rings (Stealth Carrier Frequencies) -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-dasharray="4 8">
    <circle cx="256" cy="256" r="210"/>
    <circle cx="256" cy="256" r="170"/>
    <circle cx="256" cy="256" r="130"/>
  </g>

  <!-- Left Acoustic Dispersion Waves -->
  <g stroke="url(#sonicWaveGrad)" fill="none" stroke-linecap="round" filter="url(#subtleGlow)">
    <!-- Outer Band (18 kHz) -->
    <path d="M 120 160 A 170 170 0 0 0 120 352" stroke-width="4.5" opacity="0.4"/>
    <!-- Mid Band (10 kHz) -->
    <path d="M 155 190 A 120 120 0 0 0 155 322" stroke-width="6" opacity="0.7"/>
    <!-- Inner Band -->
    <path d="M 190 220 A 70 70 0 0 0 190 292" stroke-width="7.5" opacity="0.95"/>
  </g>

  <!-- Right Acoustic Dispersion Waves -->
  <g stroke="url(#sonicWaveGrad)" fill="none" stroke-linecap="round" filter="url(#subtleGlow)">
    <!-- Inner Band -->
    <path d="M 322 220 A 70 70 0 0 1 322 292" stroke-width="7.5" opacity="0.95"/>
    <!-- Mid Band (10 kHz) -->
    <path d="M 357 190 A 120 120 0 0 1 357 322" stroke-width="6" opacity="0.7"/>
    <!-- Outer Band (18 kHz) -->
    <path d="M 392 160 A 170 170 0 0 1 392 352" stroke-width="4.5" opacity="0.4"/>
  </g>

  <!-- Center Spectral Carrier Matrix / DSSS Codeword Bars -->
  <g fill="url(#corePulse)" filter="url(#subtleGlow)">
    <!-- Vertical Harmonic Spreads -->
    <rect x="251" y="112" width="10" height="288" rx="5"/>
    
    <rect x="233" y="152" width="8" height="208" rx="4" opacity="0.85"/>
    <rect x="271" y="152" width="8" height="208" rx="4" opacity="0.85"/>

    <rect x="217" y="196" width="6" height="120" rx="3" opacity="0.6"/>
    <rect x="289" y="196" width="6" height="120" rx="3" opacity="0.6"/>
  </g>

  <!-- Central Origin Pulse Node -->
  <circle cx="256" cy="256" r="14" fill="#ffffff" filter="url(#subtleGlow)"/>
  <circle cx="256" cy="256" r="6" fill="#0d0f15"/>

  <!-- Precision Calibration Markers (SYSTEMS & CREATIONS Aesthetic) -->
  <g stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" stroke-linecap="round">
    <line x1="256" y1="56" x2="256" y2="76"/>
    <line x1="256" y1="436" x2="256" y2="456"/>
    <line x1="56" y1="256" x2="76" y2="256"/>
    <line x1="436" y1="256" x2="456" y2="256"/>
  </g>
</svg>
