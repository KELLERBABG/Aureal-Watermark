# docker/docker-compose.yml — Deployment configuration for Aureal Watermark Microservice
services:
  aureal-watermark:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: aureal-watermark:latest
    container_name: aureal-watermark-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - MAX_BODY_SIZE_MB=100
    security_opt:
      - no-new-privileges:true
